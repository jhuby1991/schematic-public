<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rako Sketch usage</title>
    <meta name="description" content="Who is signed in to Rako Sketch, what they're doing, and how the tool is used. Rako admins only.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#3C3C3C">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233C3C3C'/%3E%3Cpath d='M8 23V15M13 23V10M18 23V17M23 23V8' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='8' r='2.4' fill='%23E8641B'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
    <style>
        /* The tool's own look (custom.html, "Rako design layer"): charcoal
           chrome, light grey panels on a drawing grid, square-ish controls,
           small uppercase labels, and one signal colour - orange. */
        :root {
            --ink: #3C3C3C;
            --ink-soft: #4F4F4F;
            --text: #1A1A1A;
            --muted: #5A5A5A;
            --faint: #8A8A8A;
            --panel: #F0F0F0;
            --surface: #FFFFFF;
            --head: #EDEDED;
            --line: #C8C8C8;
            --line-dk: #A9A9A9;
            --hair: #E6E6E6;
            --grid: #E4E4E4;
            --sel: #E8641B;
            --sel-wash: rgba(232, 100, 27, 0.10);
            --bar: #4F4F4F;
            --ok: #2E7D32;
            --warn: #B4530A;
            --font: Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-display: Quicksand, Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --ease: cubic-bezier(.2, .7, .2, 1);
            --t-fast: 120ms;
            --t-med: 180ms;
            --shadow-pop: 0 12px 32px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.10);
        }
        @media (prefers-reduced-motion: reduce) { :root { --t-fast: 0ms; --t-med: 0ms; } }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.45;
            color: var(--text);
            background-color: var(--panel);
            /* The drawing grid, faint */
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: -1px -1px;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 26px; /* the status bar */
        }
        button { font: inherit; color: inherit; }
        [hidden] { display: none !important; }
        .num { font-variant-numeric: tabular-nums; }

        /* ---- Toolbar ---- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            min-height: 44px;
            padding: 6px 10px;
            background: var(--ink);
            border-bottom: 1px solid #1F1F1F;
            color: #E8E8E8;
        }
        .tb-side { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; row-gap: 6px; }
        .tb-side.right { margin-left: auto; }
        .tb-brand { display: inline-flex; align-items: center; gap: 10px; padding: 0 4px 0 2px; color: #FFFFFF; text-decoration: none; }
        .tb-brand img { height: 20px; width: auto; filter: brightness(0) invert(1); display: block; }
        .tb-title {
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: #D6D6D6;
        }
        .tb-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.14); margin: 0 9px; flex: 0 0 auto; }
        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 11px;
            border: 1px solid rgba(255,255,255,0.24);
            border-radius: 2px;
            background: rgba(255,255,255,0.09);
            color: #E8E8E8;
            font-size: 0.8rem;
            line-height: 1;
            white-space: nowrap;
            text-decoration: none;
            cursor: pointer;
            transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
        }
        .tb-btn:hover { background: rgba(255,255,255,0.17); border-color: rgba(255,255,255,0.40); color: #FFFFFF; }
        .tb-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.32); }
        .tb-btn[aria-pressed="true"] {
            background: rgba(0,0,0,0.35);
            border-color: rgba(255,255,255,0.45);
            color: #FFFFFF;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.55);
        }
        .tb-btn .bi { font-size: 0.95rem; line-height: 1; }
        .tb-btn.spin .bi { animation: spin 700ms linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tb-user { display: inline-flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 0.8rem; color: #D6D6D6; }
        .tb-user .avatar { width: 26px; height: 26px; font-size: 0.66rem; background: #5A5A5A; }

        /* ---- Layout ---- */
        main { max-width: 1320px; margin: 0 auto; padding: 18px 16px 32px; }
        .sample-banner {
            display: flex; align-items: center; gap: 10px;
            margin: 0 0 14px; padding: 9px 14px;
            border: 1px solid var(--sel); border-radius: 2px;
            background: #FFF6F0; color: #7A3410; font-size: 0.84rem;
        }
        .grid { display: grid; gap: 14px; margin-bottom: 14px; }
        main > .panel { margin-bottom: 14px; }
        .grid.two { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
        .grid.two.even { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
        @media (max-width: 980px) { .grid.two, .grid.two.even { grid-template-columns: minmax(0, 1fr); } }

        /* ---- Panels: the palette's look ---- */
        .panel {
            background: var(--surface);
            border: 1px solid var(--line-dk);
            border-radius: 2px;
            min-width: 0;
            transition: opacity var(--t-med) var(--ease);
        }
        .loading .panel { opacity: 0.55; }
        .panel-head {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 38px;
            padding: 8px 12px;
            background: var(--head);
            border-bottom: 1px solid var(--line-dk);
        }
        .panel-head h2 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .panel-head .sub { font-size: 0.78rem; color: var(--faint); }
        .panel-head .end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .panel-body { padding: 14px; }
        .count {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 20px; height: 20px; padding: 0 6px;
            border-radius: 10px; background: var(--ink); color: #FFFFFF;
            font-size: 0.72rem; font-weight: 600;
        }
        .live-dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--sel); flex: 0 0 auto; }
        .live-dot::after {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            border: 2px solid var(--sel); opacity: 0; animation: pulse 2.4s var(--ease) infinite;
        }
        @keyframes pulse { 0% { transform: scale(0.5); opacity: 0.7; } 70%, 100% { transform: scale(1.4); opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .live-dot::after { animation: none; } }
        .link-btn {
            border: 0; background: none; padding: 0; cursor: pointer;
            color: var(--muted); font-size: 0.78rem; text-decoration: underline; text-underline-offset: 2px;
        }
        .link-btn:hover { color: var(--text); }
        .empty { padding: 22px 14px; color: var(--muted); font-size: 0.88rem; text-align: center; }
        .empty .bi { display: block; font-size: 1.6rem; color: #B4B4B4; margin-bottom: 6px; }

        /* ---- Avatars ---- */
        .avatar {
            flex: 0 0 auto;
            display: inline-flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--ink); color: #FFFFFF;
            font-size: 0.74rem; font-weight: 600; letter-spacing: 0.03em;
        }
        .avatar.sm { width: 24px; height: 24px; font-size: 0.6rem; }

        /* ---- Signed in now ---- */
        .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
        .person {
            display: flex; flex-direction: column; gap: 10px;
            padding: 12px 14px 13px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: #FCFCFC;
            animation: in var(--t-med) var(--ease);
        }
        .person.is-active { border-left: 3px solid var(--sel); padding-left: 12px; }
        @keyframes in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
        .person-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .person-top > div { min-width: 0; flex: 1 1 auto; }
        .person-name { font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .person-email { font-size: 0.76rem; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .state {
            display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
            font-family: var(--font-display); font-size: 0.66rem; font-weight: 600;
            letter-spacing: 0.07em; text-transform: uppercase; color: var(--text);
        }
        .state::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #A0A0A0; }
        .state[data-state="active"]::before { background: var(--ok); }
        .state[data-state="idle"]::before { background: transparent; box-shadow: inset 0 0 0 2px var(--warn); }
        .state[data-state="away"]::before { background: transparent; box-shadow: inset 0 0 0 2px #A0A0A0; }
        .doing { font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
        .doing .bi { color: var(--muted); margin-right: 6px; font-size: 0.95rem; }
        .facts { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 0.82rem; }
        .facts dt { color: var(--faint); }
        .facts dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .facts dd small { color: var(--faint); font-size: 0.78rem; }
        .earlier { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hair); font-size: 0.82rem; color: var(--muted); }
        .earlier b { color: var(--text); font-weight: 600; }

        /* ---- Stat tiles ---- */
        .kpis { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; margin-bottom: 14px; }
        .kpi { padding: 12px 14px 13px; border-right: 1px solid var(--hair); min-width: 0; }
        .kpi:last-child { border-right: 0; }
        .kpi-label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi-value { font-size: 1.65rem; font-weight: 600; line-height: 1.2; margin-top: 2px; letter-spacing: -0.01em; }
        .kpi-value small { font-size: 0.9rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
        .kpi-delta { font-size: 0.74rem; color: var(--faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi-delta .up, .kpi-delta .down { color: var(--text); font-weight: 600; }
        @media (max-width: 1100px) {
            .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .kpi { border-bottom: 1px solid var(--hair); }
            .kpi:nth-child(4n) { border-right: 0; }
        }
        @media (max-width: 560px) {
            .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .kpi:nth-child(4n) { border-right: 1px solid var(--hair); }
            .kpi:nth-child(2n) { border-right: 0; }
        }

        /* ---- Charts ---- */
        .chart { position: relative; width: 100%; }
        .chart svg { display: block; width: 100%; overflow: visible; }
        .chart .grid-line { stroke: var(--hair); stroke-width: 1; shape-rendering: crispEdges; }
        .chart .axis-line { stroke: var(--line-dk); stroke-width: 1; shape-rendering: crispEdges; }
        .chart text { font-family: var(--font); font-size: 11px; fill: var(--faint); font-variant-numeric: tabular-nums; }
        .chart .col { fill: var(--bar); transition: fill var(--t-fast) var(--ease); }
        .chart .col.today { fill: var(--sel); }
        .chart .hit { fill: transparent; cursor: default; outline: none; }
        .chart .hit:hover + .col, .chart .hit:focus + .col { fill: #2A2A2A; }
        .chart .hit:hover + .col.today, .chart .hit:focus + .col.today { fill: #C9500F; }
        .chart .hit:focus-visible { stroke: var(--sel); stroke-width: 1.5; }
        .tooltip {
            position: absolute; z-index: 5; pointer-events: none;
            min-width: 150px; padding: 8px 10px;
            background: #FFFFFF; border: 1px solid var(--line-dk); border-radius: 2px;
            box-shadow: var(--shadow-pop); font-size: 0.8rem; line-height: 1.4;
            transform: translate(-50%, calc(-100% - 10px));
        }
        .tooltip .tt-date { color: var(--muted); font-size: 0.74rem; margin-bottom: 3px; }
        .tooltip .tt-val { font-size: 1rem; font-weight: 600; }
        .tooltip .tt-row { color: var(--muted); }
        .chart-foot { display: flex; align-items: center; gap: 14px; margin-top: 8px; font-size: 0.76rem; color: var(--faint); flex-wrap: wrap; }
        .key { display: inline-flex; align-items: center; gap: 6px; }
        .key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--bar); }
        .key i.today { background: var(--sel); }

        /* Horizontal bars (features, parts) */
        .hbars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 7px 10px; align-items: center; font-size: 0.84rem; }
        .hbars .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; color: var(--text); }
        .hbars .track { height: 12px; position: relative; }
        .hbars .fill { position: absolute; left: 0; top: 0; bottom: 0; min-width: 2px; background: var(--bar); border-radius: 0 4px 4px 0; transition: width var(--t-med) var(--ease); }
        .hbars .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
        .unused { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hair); font-size: 0.8rem; color: var(--faint); }
        .unused b { color: var(--muted); font-weight: 600; }

        /* ---- Table ---- */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        th {
            position: sticky; top: 0;
            padding: 8px 10px; text-align: right; white-space: nowrap;
            font-family: var(--font-display); font-size: 0.66rem; font-weight: 600;
            letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted);
            background: #FAFAFA; border-bottom: 1px solid var(--line);
        }
        th:first-child, td:first-child { text-align: left; }
        th button { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; }
        th button:hover { color: var(--text); }
        th[aria-sort] button { color: var(--text); }
        th[aria-sort="descending"] button::after { content: ' ↓'; }
        th[aria-sort="ascending"] button::after { content: ' ↑'; }
        td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--hair); font-variant-numeric: tabular-nums; white-space: nowrap; }
        tbody tr { cursor: pointer; transition: background-color var(--t-fast) var(--ease); }
        tbody tr:hover { background: #F6F6F6; }
        tbody tr.picked { background: var(--sel-wash); }
        tbody tr.picked td:first-child { box-shadow: inset 3px 0 0 var(--sel); }
        tbody tr:last-child td { border-bottom: 0; }
        .who { display: flex; align-items: center; gap: 8px; }
        .who span { font-weight: 600; }
        .who .online { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: 0 0 auto; }
        .time-cell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
        .time-cell i { display: inline-block; height: 6px; background: var(--bar); border-radius: 0 3px 3px 0; min-width: 2px; }
        td.muted { color: var(--faint); }

        details.table-view { margin-top: 10px; }
        details.table-view summary { cursor: pointer; font-size: 0.78rem; color: var(--muted); }
        details.table-view table { margin-top: 8px; font-size: 0.8rem; }

        /* ---- Activity feed ---- */
        .feed-scroll { max-height: 640px; overflow-y: auto; overscroll-behavior: contain; }
        .feed { list-style: none; margin: 0; padding: 0; }
        .feed-day {
            position: sticky; top: 0; z-index: 1;
            padding: 7px 14px; background: #FAFAFA;
            border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair);
            font-family: var(--font-display); font-size: 0.66rem; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
        }
        .feed-day:first-child { border-top: 0; }
        .feed-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #F2F2F2; font-size: 0.86rem; }
        .feed-row time { flex: 0 0 auto; min-width: 40px; white-space: nowrap; color: var(--faint); font-variant-numeric: tabular-nums; font-size: 0.8rem; padding-top: 3px; }
        .feed-row .avatar { margin-top: 0; }
        .feed-row .what { position: relative; flex: 1 1 auto; min-width: 0; padding: 2px 0 0 13px; }
        .feed-row .what b { font-weight: 600; }
        .feed-row .on { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 10px; background: #F0F0F0; color: var(--muted); font-size: 0.76rem; line-height: 1.6; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
        .feed-row.key-action .what::before { content: ''; position: absolute; left: 0; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--sel); }
        .feed-row.quiet { color: var(--faint); }
        .feed-more { padding: 10px 14px; text-align: center; border-top: 1px solid var(--hair); }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            height: 24px; padding: 0 4px 0 9px; border-radius: 12px;
            background: var(--ink); color: #FFFFFF; font-size: 0.76rem;
        }
        .chip button { border: 0; background: rgba(255,255,255,0.15); color: #FFFFFF; width: 18px; height: 18px; border-radius: 50%; padding: 0; cursor: pointer; line-height: 1; font-size: 0.7rem; }
        .chip button:hover { background: rgba(255,255,255,0.3); }

        /* ---- Sign-in / messages ---- */
        .gate { max-width: 420px; margin: 9vh auto 0; }
        .gate .panel-body { padding: 18px 18px 20px; }
        .gate h1 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 600; }
        .gate p { margin: 0 0 14px; color: var(--muted); font-size: 0.88rem; }
        .gate-head { display: flex; gap: 12px; align-items: flex-start; }
        .gate-head > .bi { font-size: 1.5rem; color: #6B6B6B; line-height: 1.1; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            height: 34px; padding: 0 16px; border-radius: 2px; cursor: pointer;
            border: 1px solid #3A3A3A; background: #4A4A4A; color: #FFFFFF;
            font-size: 0.86rem; text-decoration: none;
            transition: background-color var(--t-fast) var(--ease);
        }
        .btn:hover { background: #383838; }
        .btn.wide { width: 100%; }
        .btn.light { background: #E8E8E8; border-color: var(--line-dk); color: var(--text); }
        .btn.light:hover { background: #DCDCDC; }
        .btn:disabled { opacity: 0.6; cursor: default; }
        .btn .g { width: 16px; height: 16px; background: #FFFFFF; border-radius: 2px; padding: 1px; }
        .gate .note { margin: 12px 0 0; font-size: 0.76rem; color: var(--faint); }
        .gate .row { display: flex; gap: 8px; flex-wrap: wrap; }

        /* ---- Status bar ---- */
        .statusbar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
            display: flex; align-items: center; gap: 14px;
            height: 26px; padding: 0 12px;
            background: #F6F6F6; border-top: 1px solid var(--line);
            font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden;
        }
        .sb-mode {
            display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
            font-family: var(--font-display); font-size: 0.66rem; font-weight: 600;
            letter-spacing: 0.07em; text-transform: uppercase; color: var(--text);
        }
        .sb-mode::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #A0A0A0; }
        .sb-mode[data-mode="live"]::before { background: var(--sel); }
        .sb-hint { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .sb-spacer { flex: 1 1 auto; }

        @media (max-width: 640px) {
            .toolbar { padding: 6px 8px; }
            .tb-side.right { margin-left: 0; width: 100%; }
            .tb-user .who-name, .tb-btn .tb-label { display: none; }
            .tb-sep.opt { display: none; }
            main { padding: 14px 12px 28px; }
            .people { grid-template-columns: minmax(0, 1fr); }
